[package]
name = "orderbook"
version = "0.1.0"
edition = "2021"

[dependencies]
clob_tools = { path = "../clob_tools" }

# Miden dependencies
miden-client = { workspace = true }
miden-client-sqlite-store = { workspace = true, package = "miden-client-sqlite-store" }
miden-lib = { workspace = true }
miden-objects = { workspace = true }
miden-tx = { workspace = true }
miden-crypto = { workspace = true }
miden-assembly = { workspace = true }
miden-testing = { workspace = true }

# Database
rusqlite = { workspace = true }
rusqlite_migration = { workspace = true }

# Web server
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
dotenv = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
reqwest = { workspace = true }

# Random number generation
rand = { workspace = true }
rand_chacha = { workspace = true }

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "depth_chart"
path = "src/bin/depth_chart.rs"

[[bin]]
name = "matching_engine"
path = "src/bin/matching_engine.rs"

[[bin]]
name = "populate"
path = "src/bin/populate.rs"

[[bin]]
name = "deploy_faucets"
path = "src/bin/testing/deploy_faucets.rs"