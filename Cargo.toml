[workspace]
members = ["clob_tools", "orderbook"]
resolver = "2"

[workspace.dependencies]
# Miden dependencies
miden-client = { version = "0.12", features = ["testing", "tonic"] }
miden-client-sqlite-store = { version = "0.12", package = "miden-client-sqlite-store" }
miden-lib = { version = "0.12", default-features = false }
miden-objects = { version = "0.12", default-features = false }
miden-tx = "0.12"
miden-crypto = { version = "0.17", features = ["executable"] }
miden-assembly = "0.18"
miden-testing = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

# Async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "macros", "fs"] }

# Random number generation
rand = { version = "0.9" }
rand_chacha = "0.9.0"

# Web server dependencies
axum = { version = "0.7", features = ["macros", "tokio"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database dependencies
rusqlite = { version = "0.36", features = ["bundled", "chrono", "uuid"] }
rusqlite_migration = "2.2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Additional utilities
anyhow = "1.0"
thiserror = "1.0"
base64 = "0.22"
dotenv = "0.15"
hex = "0.4"
clap = { version = "4.0", features = ["derive"] }

